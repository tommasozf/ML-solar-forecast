name: solar
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # PyTorch — GPU build (CUDA 12.4); swap for cpuonly if no GPU
  - pytorch::pytorch=2.5.1
  - pytorch::torchvision
  - pytorch::pytorch-cuda=12.4

  # Core data science
  - numpy=1.26.*
  - pandas=2.*
  - scipy
  - scikit-learn

  # ML / forecasting
  - xgboost
  - optuna

  # Plotting
  - matplotlib
  - seaborn

  # Jupyter
  - jupyterlab
  - ipywidgets

  # Utilities
  - tqdm
  - pyyaml
  - python-dotenv

  - pip:
    # PyTorch Lightning + Temporal Fusion Transformer
    - pytorch-lightning>=2.0
    - pytorch-forecasting>=1.0

    # ERA5 data download (Copernicus Climate Data Store)
    - cdsapi

    # Open-Meteo NWP forecasts
    - openmeteo-requests
    - requests-cache
    - retry-requests

    # Geospatial (province map notebook)
    - geopandas
